<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hanger Hub - Tasty Food Delivered Fast</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #ff4757;
            --secondary-color: #ffa502;
            --bg-dark: #0f111e;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-color: #ffffff;
            --text-muted: #a4b0be;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-color);
            overflow-x: hidden;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: rgba(15, 17, 30, 0.85);
            backdrop-filter: blur(10px);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo span {
            color: var(--secondary-color);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        .nav-links a {
            color: var(--text-color);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -5px;
            left: 0;
            background-color: var(--primary-color);
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-links a:hover {
            color: var(--primary-color);
        }

        .cart-icon {
            position: relative;
            font-size: 20px;
            cursor: pointer;
            padding: 10px 18px;
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            border-radius: 30px;
            transition: transform 0.3s ease;
        }

        .cart-icon:hover {
            transform: scale(1.05);
        }

        .cart-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: white;
            color: var(--bg-dark);
            font-size: 12px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 50%;
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
            padding-top: 80px;
            background: radial-gradient(circle at 80% 20%, rgba(255, 71, 87, 0.15) 0%, transparent 40%);
        }

        .hero-text {
            max-width: 550px;
        }

        .hero-text h1 {
            font-size: 54px;
            line-height: 1.2;
            margin-bottom: 20px;
        }

        .hero-text h1 span {
            color: var(--primary-color);
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-text p {
            color: var(--text-muted);
            font-size: 16px;
            margin-bottom: 30px;
        }

        .btn {
            padding: 14px 32px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            color: white;
            box-shadow: 0 10px 20px rgba(255, 71, 87, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(255, 71, 87, 0.5);
        }

        /* Menu Section */
        .menu-section {
            padding: 80px 8%;
        }

        .section-title {
            text-align: center;
            font-size: 36px;
            margin-bottom: 50px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        /* Card with Glassmorphism and Hover Effects */
        .food-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(5px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .food-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary-color);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(255, 71, 87, 0.2);
        }

        .food-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 15px;
            transition: transform 0.4s ease;
        }

        .food-card:hover .food-img {
            transform: scale(1.05);
        }

        .food-title {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .food-desc {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .food-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }

        .price {
            font-size: 22px;
            font-weight: 700;
            color: var(--secondary-color);
        }

        .add-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--primary-color);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .add-btn:hover {
            background: var(--primary-color);
            transform: scale(1.05);
        }

        /* Toast Alert */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--primary-color);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            display: none;
            animation: slideIn 0.3s ease;
            z-index: 2000;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">
            <i class="fa-solid fa-utensils"></i> Hanger <span>Hub</span>
        </div>
        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#menu">Menu</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
        <div class="cart-icon">
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="cart-count" id="cart-count">0</span>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero" id="home">
        <div class="hero-text">
            <h1>Satisfy Your <span>Hunger</span> in Every Bite</h1>
            <p>Delicious meals delivered fast right to your doorstep. Fresh ingredients, top chefs, and instant delivery with Hanger Hub.</p>
            <button class="btn btn-primary" onclick="scrollToMenu()">Order Now</button>
        </div>
    </section>

    <!-- Menu Section -->
    <section class="menu-section" id="menu">
        <h2 class="section-title">Popular Items</h2>
        <div class="menu-grid" id="menu-container">
            <!-- Dynamic Menu Items Generated via JS -->
        </div>
    </section>

    <!-- Notification Toast -->
    <div class="toast" id="toast">Item added to your cart!</div>

    <script>
        // Menu Data
        const menuItems = [
            { id: 1, name: "Cheesy Burger", desc: "Juicy beef patty with loaded cheddar cheese", price: "₹199", img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500" },
            { id: 2, name: "Pepperoni Pizza", desc: "Crispy crust topped with pepperoni & mozzarella", price: "₹349", img: "https://images.unsplash.com/photo-1628840042765-356cda07504e?w=500" },
            { id: 3, name: "Alfredo Pasta", desc: "Rich and creamy parmesan sauce pasta", price: "₹249", img: "https://images.unsplash.com/photo-1621996346565-e3d5d6281288?w=500" },
            { id: 4, name: "Crispy Fried Chicken", desc: "Golden fried spicy chicken tenders", price: "₹299", img: "https://images.unsplash.com/photo-1626645738196-c2a7c87a8f58?w=500" }
        ];

        let cartCount = 0;

        // Display Menu Items
        function renderMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = menuItems.map(item => `
                <div class="food-card">
                    <img src="${item.img}" alt="${item.name}" class="food-img">
                    <h3 class="food-title">${item.name}</h3>
                    <p class="food-desc">${item.desc}</p>
                    <div class="food-bottom">
                        <span class="price">${item.price}</span>
                        <button class="add-btn" onclick="addToCart('${item.name}')">
                            <i class="fa-solid fa-plus"></i> Add
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Add to Cart Logic
        function addToCart(itemName) {
            cartCount++;
            document.getElementById('cart-count').innerText = cartCount;
            showToast(`${itemName} added to cart!`);
        }

        // Notification System
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 2500);
        }

        function scrollToMenu() {
            document.getElementById('menu').scrollIntoView({ behavior: 'smooth' });
        }

        // Initialize Page
        renderMenu();
    </script>
</body>
</html>
